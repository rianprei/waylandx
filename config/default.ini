# WaylandX configuration — copy to ~/.config/waylandx/config.ini
# Reload live with `waylandxctl reload` (or Mod+Shift+r, or SIGHUP).
# A file with errors is rejected as a whole and the previous config stays active.

[general]
# auto = Super on a real session, Alt when nested inside another compositor
mod = auto
terminal = alacritty
# floating (X11 style) or tiling (master/stack) as the default for every workspace
layout = floating
gap = 6
border = 2
title_height = 24
font = Sans 10
color_active = #3d7edd
color_inactive = #3a3d45
color_text = #ffffff
color_text_inactive = #b8bcc6
focus_follows_mouse = false
snap = true
snap_threshold = 12
xwayland = true
cursor_size = 24
# screenshot_dir = ~/Imagens

[input]
# kb_layout = br
# kb_variant = abnt2
# kb_options = caps:escape
repeat_rate = 25
repeat_delay = 600
# natural_scroll = false
# tap = true
# accel = 0.0

# Per-monitor settings; use the connector name from `waylandxctl outputs`, or *.
# [output:DP-1]
# mode = 2560x1440@144
# scale = 1.25
# position = 0,0
# transform = normal
# vrr = on
# allow_tearing = on

[keybind]
# Actions are waylandxctl commands. "none" removes a default binding.
# Defaults: Mod+Return terminal, Mod+d launcher, Mod+q close, Mod+Shift+q kill,
# Mod+f fullscreen, Mod+m maximize, Mod+n minimize, Mod+space floating,
# Mod+t tiling, Mod+a always-on-top, Mod+s sticky, Mod+Tab focus next,
# Mod+Left/Right snap, Mod+Up/Down maximize, Mod+1..9 workspace,
# Mod+Shift+1..9 move to workspace, Mod+h/l master size, Print screenshot,
# Mod+Shift+s screenshot of focused window, Mod+Shift+r reload, Mod+Shift+e exit.
# Mod+b = exec firefox

# Window rules: app_id/class and title are shell globs.
# [rule:calculator]
# app_id = *calculator*
# floating = true
# position = 100,100
# size = 400x500
# layer = above
#
# [rule:games]
# class = steam_app_*
# allow_tearing = true
# fullscreen = true

[autostart]
panel = waylandx-panel
